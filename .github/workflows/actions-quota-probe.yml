name: Actions Quota Probe

on:
  push:
    branches:
      - "test/actions-quota-probe-20261126"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner allocation
        run: |
          echo "RUNNER_ALLOCATED"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
